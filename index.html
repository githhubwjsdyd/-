<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>두통 체크</title>
<meta name="description" content="증상과 병력을 입력하면 응급 위험 신호를 먼저 확인하고, 가능성이 높은 두통 유형과 병원·검사·관리 방법을 안내하는 참고용 도구입니다.">
<style>
:root{--bg:#f5f6fc;--card:#ffffff;--ink:#1b2140;--mute:#5f678a;--line:#e5e8f4;--line2:#ccd1e8;--accent:#4a5ee6;--accent2:#6f80f8;--accent-ink:#ffffff;--red:#b3261e;--redbg:#fdeceb;--amber:#8a5200;--amberbg:#fff3df;--blue:#3b4cc0;--bluebg:#eceffe;--green:#1f7a4d;--greenbg:#e5f5ec;--r:18px;--shadow:0 1px 2px rgba(40,50,110,.05),0 14px 30px -18px rgba(40,50,110,.24)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1224;--card:#181c33;--ink:#eceffd;--mute:#a2a9cb;--line:#272c4a;--line2:#3b4268;--accent:#8e9cff;--accent2:#7081f4;--accent-ink:#0b0f2e;--red:#ff8a80;--redbg:#3a1a1f;--amber:#ffc266;--amberbg:#392a12;--blue:#aab6ff;--bluebg:#1a2146;--green:#7fd4a0;--greenbg:#12301f;--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;line-height:1.65;font-size:16px;background:radial-gradient(900px 480px at 8% -8%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%),radial-gradient(700px 420px at 100% 0,color-mix(in srgb,#ff9f7a 12%,transparent),transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
.top{position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.top-in{max-width:640px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:-.03em;font-size:18px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px -6px var(--accent)}
.logo svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:1.5px solid var(--line2);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:6px 14px;border-radius:99px;transition:.15s}
.link:hover{border-color:var(--accent);color:var(--accent)}
.card .link,.log .link{border:0;padding:4px 2px;color:var(--mute);font-size:13px}
main{max-width:640px;margin:0 auto;padding:6px 18px 130px}
main>*{animation:up .4s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}main>*:nth-child(n+5){animation-delay:.16s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){main>*{animation:none}html{scroll-behavior:auto}}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 20px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .35s cubic-bezier(.2,.7,.2,1)}
.stepno{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.04em}
h1{font-size:27px;line-height:1.28;letter-spacing:-.035em;margin:6px 0 8px;font-weight:800}
h2{font-size:18px;letter-spacing:-.02em;margin:0 0 8px;font-weight:800}
.desc{color:var(--mute);margin:0 0 20px}
fieldset{border:0;padding:0;margin:0 0 24px;min-width:0}
legend{font-weight:800;margin-bottom:10px;padding:0;font-size:15px;letter-spacing:-.01em}
.opt{position:relative;display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));transform:translateY(-1px);box-shadow:var(--shadow)}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.mark{flex:none;width:22px;height:22px;border:2px solid var(--line2);border-radius:50%;margin-top:2px;display:grid;place-items:center;transition:.15s;background:var(--card)}
.opt input[type=checkbox]~.mark{border-radius:7px}
.mark::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.opt:has(input:checked) .mark{background:var(--accent);border-color:var(--accent)}
.opt:has(input:checked) .mark::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.opt:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.opt span{line-height:1.5}
.range{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;box-shadow:var(--shadow)}
.sevout{display:flex;align-items:baseline;margin-bottom:14px}
.sevout b{font-size:46px;line-height:1;font-weight:800;letter-spacing:-.05em;min-width:1.2ch}
.sevout span{font-size:15px;font-weight:700;color:var(--mute);margin-left:10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;background:linear-gradient(90deg,#4caf7d,#e9b44c 55%,#d9534f);outline:0;margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.28);cursor:grab}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.28);cursor:grab}
input[type=range]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:4px}
.scale{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;font-weight:600;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.nav div{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:800;border-radius:14px;padding:15px 18px;border:1.5px solid var(--line2);cursor:pointer;flex:1;text-align:center;text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .15s,opacity .15s;letter-spacing:-.01em}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--accent-ink);border-color:transparent;box-shadow:0 10px 22px -10px var(--accent)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:11px 16px;flex:none;font-size:14px}
.note{background:var(--bluebg);color:var(--blue);border-radius:var(--r);padding:13px 15px;font-size:14px;margin:0 0 16px;display:flex;gap:10px}
.note::before{content:"i";flex:none;width:20px;height:20px;border-radius:50%;background:var(--blue);color:var(--bluebg);font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:2px}
.hero{padding:22px 0 4px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:800;color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent);padding:6px 13px;border-radius:99px;letter-spacing:.01em}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hero h1{font-size:clamp(32px,9vw,42px);line-height:1.14;letter-spacing:-.045em;margin:14px 0 12px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 64%,color-mix(in srgb,var(--accent) 28%,transparent) 64%)}
.feats{display:grid;gap:10px;margin:22px 0 18px}
.feat{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow)}
.feat b{display:block;font-size:15px;letter-spacing:-.02em}
.feat small{color:var(--mute);font-size:13px}
.ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.ic svg,.bico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.banner{display:flex;gap:16px;align-items:flex-start;border:1.5px solid;border-radius:22px;padding:20px;margin:8px 0 18px;box-shadow:var(--shadow)}
.bico{flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:currentColor}
.bico svg{width:26px;height:26px;stroke:var(--card)}
.btxt{min-width:0}
.banner h1{margin:0 0 6px;font-size:22px}
.banner p{margin:0;color:var(--ink);opacity:.82}
.banner.emergency{background:var(--redbg);border-color:var(--red);color:var(--red)}
.banner.urgent{background:var(--amberbg);border-color:var(--amber);color:var(--amber)}
.banner.clinic{background:var(--bluebg);border-color:var(--blue);color:var(--blue)}
.banner.self{background:var(--greenbg);border-color:var(--green);color:var(--green)}
.banner .call{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.banner .btn{flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card ul{margin:8px 0 0;padding-left:20px}
.card li{margin-bottom:6px}
.card li::marker{color:var(--accent)}
.card.red{border-color:color-mix(in srgb,var(--red) 55%,var(--line));background:linear-gradient(var(--card),var(--card)) padding-box}
.card.red h2{color:var(--red)}
.rank{margin:14px 0}
.rank .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.rank .row em{font-style:normal;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--mute)}
.rank .row em.hi{background:var(--accent);color:var(--accent-ink)}
.rank .row em.mid{background:color-mix(in srgb,var(--accent) 22%,var(--card));color:var(--accent)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:7px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;animation:grow .8s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.rank small{color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--line);margin-right:6px;color:var(--mute)}
details{margin-bottom:14px}
summary{cursor:pointer;font-weight:800;padding:8px 2px;color:var(--mute)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.actions .btn{flex:none;width:100%}
.actions #copy{grid-column:1/-1}
.disc{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px;margin-top:22px}
footer{max-width:640px;margin:0 auto;padding:0 18px 150px;font-size:12px;color:var(--mute)}
.log{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.log b{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:9;box-shadow:var(--shadow)}
@media print{.nav,.top,.actions,footer{display:none}body{background:#fff}}

.hero-art{display:block;width:100%;max-width:340px;height:auto;margin:18px auto 0}
.hico{flex:none;width:42px;height:42px;margin:-4px 0}
.opt.withic{align-items:center}
.opt.withic .mark{margin-top:0}
.tips .desc{margin-bottom:6px}
.tip{display:flex;gap:14px;padding:15px 0;border-top:1px solid var(--line)}
.tip:first-of-type{border-top:0}
.tip .ic{width:40px;height:40px;border-radius:12px;margin-top:2px}
.tip .ic svg{width:21px;height:21px}
.tip b{letter-spacing:-.02em;line-height:1.4;display:block}
.tip p{margin:5px 0 0;color:var(--mute);font-size:14.5px;line-height:1.6}
.tip .warn{color:var(--amber);background:var(--amberbg);border-radius:12px;padding:9px 12px;font-size:13.5px;margin-top:9px}
.tip.rel{background:color-mix(in srgb,var(--accent) 7%,transparent);margin:0 -10px;padding:15px 10px;border-radius:14px;border-top-color:transparent}
.badge{display:inline-block;margin-top:5px;font-size:12px;font-weight:800;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:2px 10px}
.tips details{margin:0}
.tips summary{border-top:1px solid var(--line);padding:14px 2px 4px;color:var(--accent)}

.cand{margin:16px 0 4px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.cand:last-of-type{border-bottom:0}
.grp{display:inline-block;font-size:11.5px;font-weight:800;color:var(--mute);background:var(--line);padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:2px}
.why{font-size:13px;color:var(--mute);margin-top:6px}
.why b{color:var(--ink);margin-right:4px}
.cause{padding:12px 0;border-top:1px solid var(--line)}
.cause b{display:block;letter-spacing:-.02em}
.cause p{margin:4px 0 0;color:var(--mute);font-size:14.5px;line-height:1.6}
.reassure{margin:6px 0 0;font-size:13.5px;color:var(--blue);background:var(--bluebg);border-radius:12px;padding:10px 13px}
fieldset+fieldset{margin-top:6px}

.rank .row{gap:10px;align-items:flex-start}
.rank .row>span{min-width:0;line-height:1.45}
.rank .row em{flex:none;white-space:nowrap;margin-top:1px}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6h5"/></svg></span>두통 체크</div><button class="link" id="btnLog" type="button">내 기록</button></div></header>
<main id="app"></main>
<footer>
근거: 국제두통질환분류 3판(ICHD-3), NICE 지침 CG150(12세 이상 두통의 진단과 관리), 대한신경과학회 두통 안내서. 이 도구는 의료진의 진단·치료를 대신하지 않으며, 입력한 내용은 이 기기 밖으로 전송되지 않습니다.
</footer>

<script>
"use strict";
/* ================= 질문 정의 ================= */
const STEPS=[
{id:"emergency",title:"먼저, 지금 이런 증상이 있나요?",desc:"해당되는 것을 모두 골라 주세요. 위쪽은 바로 응급 진료가 필요한 증상, 아래쪽은 오늘 안에 진료를 권하는 증상이에요.",
 fields:[
 {id:"em",type:"check",label:"바로 119나 응급실이 필요할 수 있어요",options:[
 {v:"thunder",l:"벼락 치듯 갑자기 시작해 1분 안에 최고로 아파졌다"},
 {v:"worst",l:"살면서 겪은 가장 심한 두통이다"},
 {v:"neuro",l:"팔다리에 힘이 빠지거나 저리다 / 얼굴 한쪽이 처진다 / 말이 어눌하다 / 갑자기 시야가 안 보이거나 물체가 둘로 보인다"},
 {v:"conscious",l:"의식이 흐리거나 심하게 졸리고 혼란스럽다, 또는 경련을 했다"},
 {v:"meningitis",l:"열(38℃ 이상)과 함께 목이 뻣뻣해 고개를 숙이기 어렵다"},
 {v:"rash",l:"열과 함께 멍처럼 번지는 붉은·보라색 반점이 생겼다"},
 {v:"headinjury",l:"머리를 다친 뒤 구토가 반복되거나, 두통이 점점 심해지거나, 자꾸 졸리다"},
 {v:"co",l:"같은 공간에 있는 여러 사람이 함께 두통·어지러움·구역이 있다 (난방기구·밀폐된 공간)"},
 {v:"eye",l:"한쪽 눈이 몹시 아프고 시력이 떨어지며 불빛 주위에 무지개 같은 테가 보인다"},
 {v:"preg",l:"임신 중이거나 출산 후 6주 이내인데, 심한 두통과 함께 시야가 번쩍이거나 얼굴·손이 붓는다"},
 {v:"none",l:"위에 해당하는 것이 없다",exclusive:true}]},
 {id:"warn",type:"check",label:"오늘 안에 진료를 받는 게 좋아요",options:[
 {v:"worsen",l:"며칠 사이에 두통이 점점 심해지고 있다"},
 {v:"vomit",l:"두통과 함께 구토가 반복된다 (머리를 다치지는 않았다)"},
 {v:"dizzy",l:"어지럽고 걸을 때 비틀거리거나 균형이 잡히지 않는다"},
 {v:"fever",l:"열이 나면서 두통이 심하다 (목은 뻣뻣하지 않다)"},
 {v:"trauma",l:"머리를 가볍게 부딪친 뒤 두통이 계속된다"},
 {v:"eyered",l:"한쪽 눈이 빨갛고 아프면서 시야가 뿌옇게 보인다"},
 {v:"none",l:"해당하는 것이 없다",exclusive:true}]}]},
{id:"basic",title:"나이대를 알려주세요",desc:"나이에 따라 확인해야 할 위험 신호가 달라져요.",
 fields:[{id:"age",type:"radio",label:"나이대",options:[
 {v:"child",l:"만 12세 미만"},{v:"teen",l:"12~17세"},{v:"adult",l:"18~49세"},{v:"mid",l:"50~64세"},{v:"senior",l:"65세 이상"}]}]},
{id:"course",title:"두통이 어떻게 시작됐나요?",desc:"시작 방식과 경과는 원인을 가리는 데 중요한 단서예요.",
 fields:[
 {id:"onset",type:"radio",label:"두통이 심해진 속도",options:[
  {v:"peak5",l:"갑자기, 5분 안에 가장 심해졌다"},{v:"hours",l:"몇 시간에 걸쳐 점점 심해졌다"},{v:"gradual",l:"며칠~몇 주에 걸쳐 서서히 심해졌다"}]},
 {id:"since",type:"radio",label:"이번 두통이 이어진 기간",options:[
  {v:"today",l:"오늘 시작했다"},{v:"days",l:"2일~2주"},{v:"weeks",l:"2주 이상 계속되거나 반복된다"}]},

function lab(fid,v){
 for(const s of STEPS)for(const f of s.fields)if(f.id===fid&&f.options){const o=f.options.find(x=>x.v===v);if(o)return o.l}

function scoreTypes(a){
 const c={a,sv:+a.sev,S:new Set(a.sym||[]),R:new Set(a.red||[]),H:new Set(a.hist||[]),L:new Set(a.life||[])};
 c.auto=["tear","redeye","nasal","lid","sweat"].filter(x=>c.S.has(x)).length;
 const out=[];
 for(const [key,d] of Object.entries(TYPE_DEFS)){
  let s=0;const why=[];
  for(const [fn,w,txt] of d.f){if(fn(c)){s+=w;why.push([w,txt])}}
  for(const [fn,w] of (d.p||[])){if(fn(c))s-=w}
  s=Math.max(0,s);
  let pct=Math.min(100,Math.round(s/d.max*100));
  if(d.gate&&!d.gate(c))pct=Math.min(pct,d.cap||15);
  why.sort((x,y)=>y[0]-x[0]);
  out.push({key,def:d,pct,why:why.slice(0,3).map(x=>x[1]),label:pct>=60?"가능성 높음":pct>=40?"가능성 보통":"가능성 낮음",lv:pct>=60?"hi":pct>=40?"mid":"lo"});
 }
 return out.sort((x,y)=>y.pct-x.pct);
}

function evaluate(a){
 const S=new Set(a.sym||[]),Rd=new Set(a.red||[]),H=new Set(a.hist||[]),W=new Set(a.warn||[]);
 const hs=v=>S.has(v),hr=v=>Rd.has(v),hh=v=>H.has(v);
 const sv=+a.sev,old=["mid","senior"].includes(a.age),child=a.age==="child";
 const notSame=a.compare!=="same";
 const R={emergency:[],urgent:[],clinic:[]};
 const add=(L,k,t,c)=>{if(!R[L].some(x=>x.k===k))R[L].push({k,t,c})};
 (a.em||[]).filter(x=>x!=="none").forEach(k=>add("emergency",k,EM_TXT[k],EM_CAUSE[k]));
 if(a.onset==="peak5"&&notSame)add("emergency","peak5","5분 안에 최고 강도에 이르는 갑작스러운 두통 (처음이거나 평소와 다른 경우)","sah");
 if(hs("fever")&&hs("stiffneck"))add("emergency","meningitis","발열과 목 뻣뻣함이 함께 있음","mening");

 if((hh("cancer")||hh("immuno"))&&notSame)add("urgent","canimm","암 또는 면역저하 상태에서 새롭거나 달라진 두통","canimm");

 if(hh("vascular")&&notSame)add("urgent","vasc","뇌혈관 질환 병력 또는 가족력이 있으면서 새롭거나 달라진 두통","vasc");
 if(hh("trauma")&&!hh("anticoag")&&(a.compare!=="same"||a.since!=="weeks"))add("urgent","trauma","최근 머리 외상 이후 생긴 두통","bleed");
 if(hs("fever")&&!hs("stiffneck")&&(sv>=7||hh("immuno")||a.age==="senior"||child))add("urgent","fever","발열을 동반한 두통 (통증이 심하거나 면역·나이·소아 위험 요인이 있음)","inf");
 if(a.compare==="changed"&&(sv>=7||old))add("urgent","changed","평소 두통과 양상·강도가 크게 달라짐","changed");
 if(hh("preg")&&(sv>=5||notSame))add("urgent","pregh","임신·산후 중 두통 (혈압과 소변 검사 확인 필요)","pree");
 if(child&&sv>=7)add("urgent","child","소아에서 강한 두통","childc");
 if(hh("htn")&&sv>=8)add("urgent","htn","고혈압이 있으면서 매우 심한 두통","htn");
 if(sv>=9)add("urgent","sev","통증이 9~10단계로 매우 심함","sevc");

 const cand=scoreTypes(a),top=cand[0];

 if(a.compare==="first"&&sv>=5)add("clinic","first","처음 겪는 두통이면서 통증이 중간 이상");

 if(top.key==="cluster"&&top.pct>=50)add("clinic","cluster","군발두통의 특징이 뚜렷함 (전문 치료가 필요한 두통)");
 if(top.key==="migraine"&&top.pct>=60&&(sv>=6||a.freq!=="rare"))add("clinic","mig","편두통 특징이 뚜렷하고 통증이 강하거나 자주 반복됨");
 if(a.compare==="changed")add("clinic","chg","평소 두통의 양상이나 강도가 달라짐");
 if(hr("temple")&&!old)add("clinic","temple","관자놀이·두피 압통 또는 씹을 때 턱 통증");
 if(hs("fever")&&!R.urgent.length)add("clinic","fever2",a.since==="today"?"열을 동반한 두통 (48시간 안에 좋아지지 않으면 진료)":"열이 며칠째 이어지는 두통 (진료를 권장)");
 if(child)add("clinic","childv","만 12세 미만은 소아청소년과 진료를 권장");
 if(hh("preg"))add("clinic","pregv","임신·산후 중에는 약 선택이 제한되므로 의료진과 상의");
 if(hh("newmed"))add("clinic","newmed","최근 시작·변경한 약이 두통의 원인일 수 있음");
 if(hh("sinus")&&sv>=5)add("clinic","sinus","감기·코막힘과 함께 얼굴 압박감 (부비동 문제 가능성)");

 const level=R.emergency.length?"emergency":R.urgent.length?"urgent":R.clinic.length?"clinic":"self";
 return{level,R,cand,top};
}

 }else if(L==="urgent"){

function summaryText(a,r){
 const LV={emergency:"즉시 응급 진료 권장",urgent:"오늘 안에 진료 권장",clinic:"가까운 시일 내 외래 진료 권장",self:"자가 관리 후 경과 관찰"};
 const j=k=>(a[k]||[]).filter(x=>x!=="none").map(x=>lab(k,x));
 const lines=["[두통 체크 요약] "+new Date().toLocaleString("ko-KR"),
 "판정: "+LV[r.level],
 "나이대: "+lab("age",a.age),
 "시작: "+lab("onset",a.onset)+" / 기간: "+lab("since",a.since)+" / 이전과 비교: "+lab("compare",a.compare),
 "빈도: "+lab("freq",a.freq)+" / 진통제: "+lab("meds",a.meds),
 "통증: "+a.sev+"/10, "+lab("loc",a.loc)+", "+lab("quality",a.quality)+", 지속 "+lab("dur",a.dur)+", "+lab("act",a.act),
 "동반 증상: "+(j("sym").join(", ")||"없음"),
 "위험 신호: "+((r.R.emergency.concat(r.R.urgent)).map(x=>x.t).join("; ")||"없음"),
 "상황·특징: "+(j("red").join(", ")||"없음"),
 "병력·최근 일: "+(j("hist").join(", ")||"없음"),
 "생활: "+(j("life").join(", ")||"없음"),
 "가능성 높은 유형: "+(r.cand.filter(x=>x.pct>=30).slice(0,3).map(x=>x.def.name+"("+x.label+")").join(", ")||"뚜렷한 유형 없음")];
 return lines.join("\n");
}

function candHtml(x,a){
 const note=x.key==="migraine"&&(a.life||[]).includes("menstrual")?" 생리 전후에 반복된다면 '월경 편두통'일 수 있어요.":"";
 return`<div class="rank cand"><div class="row"><span>${x.def.name}<span class="grp">${x.def.grp}</span></span><em class="${x.lv}">${x.label}</em></div><div class="bar"><i style="width:${Math.max(6,x.pct)}%"></i></div><small>${x.def.desc}${note}</small>${x.why.length?`<div class="why"><b>근거</b> ${x.why.map(esc).join(" · ")}</div>`:""}</div>`;
}
function causeHtml(r){
 const list=r.level==="emergency"?r.R.emergency.concat(r.R.urgent):r.level==="urgent"?r.R.urgent:[];
 const keys=[...new Set(list.map(x=>x.c).filter(Boolean))].slice(0,4);
 if(!keys.length)return"";
 const head=r.level==="emergency"?"무슨 뜻인가요? 쉬운 설명":"왜 오늘 진료를 권하나요?";
 return`<div class="card"><h2>${head}</h2><p class="desc" style="margin:0 0 4px;font-size:14px">선택하신 증상에서 먼저 확인해야 하는 원인이에요.</p>${keys.map(k=>`<div class="cause"><b>${CAUSES[k].n}</b><p>${CAUSES[k].d}</p></div>`).join("")}<p class="reassure">진단이 아니라 '먼저 배제해야 하는 위험한 원인'을 알려드리는 거예요. 검사해 보면 큰 문제가 아닌 경우도 많지만, 놓치면 위험해서 확인이 먼저예요.</p></div>`;
}

function tipsHtml(a){
 const items=TIPS.map((x,i)=>({x,i,rel:x.rel?!!x.rel(a):false})).sort((p,q)=>(q.rel-p.rel)||(p.i-q.i));
 const row=o=>`<div class="tip${o.rel?" rel":""}"><span class="ic"><svg viewBox="0 0 24 24">${TIPSIC[o.x.ic]}</svg></span><div><b>${o.x.t}</b>${o.rel?'<span class="badge">지금 해당될 수 있어요</span>':""}<p>${o.x.b}</p>${o.x.warn?`<p class="warn">${o.x.warn}</p>`:""}</div></div>`;
 const first=items.slice(0,3).map(row).join(""),rest=items.slice(3).map(row).join("");
 return `<div class="card tips"><h2>혹시 이것도 알고 계셨나요?</h2><p class="desc" style="margin:0 0 4px;font-size:14px">두통의 원인이 머리 밖에 있는 경우도 꽤 있어요.</p>${first}${rest?`<details><summary>더 보기 (${items.length-3})</summary>${rest}</details>`:""}</div>`;
}

function renderResult(){

 const H={
  emergency:["지금 바로 응급 진료가 필요할 수 있어요","119에 전화하거나 가까운 응급실로 가세요. 직접 운전하지 마세요."],
  urgent:["오늘 안에 진료를 받아보세요","가능하면 오늘 중 응급실 또는 당일 진료가 되는 병원에 가세요. 증상이 심해지면 바로 응급실로 가세요."],
  clinic:["가까운 시일 내 외래 진료를 권해요","며칠~2주 안에 신경과(또는 가정의학과) 진료를 예약해 두세요."],

 }[r.level];

 const why=r.level==="emergency"?T("emergency"):r.level==="urgent"?T("urgent"):r.level==="clinic"?T("clinic"):["응급·긴급 위험 신호가 선택되지 않았어요","평소 겪던 두통과 비슷하고 통증이 심하지 않아요"];

 const topLine=shown.length&&shown[0].pct>=40?`입력하신 증상은 <b>${shown[0].def.name}</b> 쪽 특징과 가장 많이 겹쳐요.`:"입력하신 증상이 어느 한 유형에 뚜렷하게 맞지 않아요. 정보가 부족하거나 여러 요인이 섞였을 수 있어요.";
 const rankCard=`<div class="card"><h2>가능성이 높은 두통 유형</h2><p class="desc" style="margin:0 0 6px">${topLine} 아래는 확률이 아니라, 입력한 증상이 각 유형의 대표 특징(ICHD-3, NICE 기준)과 얼마나 겹치는지를 나타내요.</p>${shown.map(x=>candHtml(x,a)).join("")}${others.length?`<details><summary>그 밖의 가능성 보기 (${others.length})</summary>${others.map(x=>`<div class="rank"><div class="row"><span>${x.def.name}<span class="grp">${x.def.grp}</span></span><em class="lo">${x.label}</em></div><small>${x.def.desc}</small></div>`).join("")}</details>`:""}${a.meds==="m10"?`<p><span class="tag">주의</span>진통제를 월 10일 이상 쓰면 약물과용두통이 생길 수 있어요. 임의로 갑자기 끊기보다 의사와 조절 계획을 세우세요.</p>`:""}<p style="margin:8px 0 0;color:var(--mute);font-size:14px">이차성 두통(다른 원인 때문에 생긴 두통) 가능성: <b>${r.level==="emergency"?"먼저 배제해야 함":r.level==="urgent"?"확인이 필요함":"뚜렷한 위험 신호 없음"}</b></p></div>`;

 ${causeHtml(r)}

 <div class="card"><h2>어디로 가야 하나요?</h2>${p.depts.map(d=>`<p style="margin:8px 0 0"><b>${d[0]}</b><br><span style="color:var(--mute)">${d[1]}</span></p>`).join("")}</div>

 ${r.level==="emergency"?"":`<div class="card red"><h2>이런 일이 생기면 바로 응급실</h2><ul>${WATCH.map(x=>`<li>${x}</li>`).join("")}</ul></div>`}
 ${r.level==="emergency"?"":tipsHtml(a)}
 <div class="actions"><button class="btn primary sm" id="copy" type="button">의사에게 보여줄 요약 복사</button><button class="btn ghost sm" id="save" type="button">기록에 저장</button><button class="btn ghost sm" id="redo" type="button">처음부터 다시</button></div>
 <p class="disc">이 결과는 입력한 정보만으로 만든 참고 자료이며 진단이 아닙니다. 증상이 걱정되거나 입력한 것과 다르게 악화되면 결과와 상관없이 의료진에게 진료를 받으세요.</p>
 <div class="nav"><div><button class="btn ghost" id="back" type="button">답 고치기</button></div></div>`;
 window.scrollTo(0,0);
}

/* ================= 기록 ================= */
const KEY="headache-check-log-v1";
function getLog(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function setLog(v){try{localStorage.setItem(KEY,JSON.stringify(v));return true}catch(e){return false}}
function renderLog(){
 const log=getLog();
 const NAME={emergency:"응급",urgent:"오늘 진료",clinic:"외래 권장",self:"자가 관리"};
 app.innerHTML=`<h1>내 기록</h1><p class="desc">이 기기의 브라우저에만 저장돼요. 8주 정도 모으면 진료받을 때 큰 도움이 돼요.</p>
 ${log.length?log.slice().reverse().map((e,i)=>`<div class="card log"><div><b>${esc(e.date)}</b><span class="tag">${NAME[e.level]}</span><span class="tag">통증 ${e.sev}/10</span><br><span style="color:var(--mute);font-size:14px">${esc(e.top)} 특징 일치 · ${esc(e.sym||"동반 증상 없음")}</span></div><button class="link" data-del="${log.length-1-i}" type="button">삭제</button></div>`).join(""):`<div class="card">저장된 기록이 없어요.</div>`}
 <div class="actions"><button class="btn primary sm" id="closeLog" type="button">돌아가기</button>${log.length?`<button class="btn ghost sm" id="clearLog" type="button">전체 삭제</button>`:""}</div>`;
 window.scrollTo(0,0);
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

/* ================= 이벤트 ================= */
function syncChecks(name){
 document.querySelectorAll(`input[name="${name}"]`).forEach(i=>{i.checked=(state.a[name]||[]).includes(i.value)});
}
app.addEventListener("change",e=>{
 const t=e.target;if(!t.name)return;
 const f=STEPS.flatMap(s=>s.fields).find(x=>x.id===t.name);if(!f)return;
 if(f.type==="radio")state.a[t.name]=t.value;
 else{
  let cur=(state.a[t.name]||[]).slice();
  const o=f.options.find(x=>x.v===t.value);
  if(t.checked){
   if(o&&o.exclusive)cur=[t.value];
   else{cur=cur.filter(x=>{const oo=f.options.find(y=>y.v===x);return !(oo&&oo.exclusive)});cur.push(t.value)}
  }else cur=cur.filter(x=>x!==t.value);
  state.a[t.name]=cur;syncChecks(t.name);
 }
 const nx=document.getElementById("next");
 if(nx&&state.step>0&&state.step<RESULT)nx.disabled=!stepValid(STEPS[state.step-1]);
});
app.addEventListener("input",e=>{
 if(e.target.id==="sev"){state.a.sev=+e.target.value;document.getElementById("sevn").textContent=e.target.value;document.getElementById("sevt").textContent=sevText(e.target.value)}
});
app.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.id==="start"){state.step=1;render()}
 else if(b.id==="next"){
  if(state.step===1&&(state.a.em||[]).some(x=>x!=="none")){state.step=RESULT}
  else state.step=Math.min(state.step+1,RESULT);
  render();
 }
 else if(b.id==="back"){
  if(state.step===RESULT&&(state.a.em||[]).some(x=>x!=="none")&&!state.a.age)state.step=1;
  else state.step=Math.max(state.step-1,0);
  render();
 }
 else if(b.id==="redo"){state.step=0;state.a={sev:5};render()}
 else if(b.id==="copy"){
  const txt=summaryText(state.a,state.r);
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("요약을 복사했어요")).catch(()=>{
   const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
   try{document.execCommand("copy");toast("요약을 복사했어요")}catch(_){toast("복사에 실패했어요")}ta.remove();
  });
 }
 else if(b.id==="save"){
  const a=state.a,r=state.r,log=getLog();
  log.push({date:new Date().toLocaleString("ko-KR"),level:r.level,sev:a.sev,top:r.top.def.name,sym:(a.sym||[]).filter(x=>x!=="none").map(x=>lab("sym",x).split(" ")[0]).slice(0,3).join(", ")});
  toast(setLog(log)?"기록에 저장했어요":"저장할 수 없어요 (브라우저 설정 확인)");
 }
 else if(b.id==="closeLog"){state.view="wizard";render()}
 else if(b.id==="clearLog"){if(confirm("기록을 모두 삭제할까요?")){setLog([]);renderLog()}}
 else if(b.dataset.del!==undefined){const log=getLog();log.splice(+b.dataset.del,1);setLog(log);renderLog()}
});
document.getElementById("btnLog").addEventListener("click",()=>{state.view=state.view==="log"?"wizard":"log";render()});
render();
</script>
